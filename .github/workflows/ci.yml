name: CI Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify Universal Binary
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Compile and Package MySound
        run: ./build.sh

      - name: Verify generated artifacts & architecture
        run: |
          test -f build/MySound.app/Contents/MacOS/MySound
          test -f build/MySound.dmg
          test -f build/MySound.zip
          echo "Architecture check:"
          lipo -info build/MySound.app/Contents/MacOS/MySound
          echo "Entitlements check:"
          codesign -d --entitlements :- build/MySound.app
