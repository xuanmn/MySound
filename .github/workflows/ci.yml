name: CI Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs for the same branch/PR to save macOS runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify Universal Binary
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
            echo "Selected: $XCODE_PATH"
          fi
          xcodebuild -version

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Compile and Package MySound
        run: ./build.sh

      - name: Verify generated artifacts & architecture
        run: |
          test -f build/MySound.app/Contents/MacOS/MySound
          test -f build/MySound.dmg
          test -f build/MySound.zip
          echo "Architecture check:"
          lipo -info build/MySound.app/Contents/MacOS/MySound
          echo "Entitlements check:"
          codesign -d --entitlements :- build/MySound.app

      - name: Upload Build Artifacts (Testing)
        uses: actions/upload-artifact@v4
        with:
          name: MySound-CI-Build-${{ github.sha }}
          path: |
            build/MySound.dmg
            build/MySound.zip
          retention-days: 7
