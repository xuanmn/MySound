name: Release App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag (e.g. v1.5.2). Leave empty to use version.json."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
            echo "Selected: $XCODE_PATH"
          fi
          xcodebuild -version

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build and Package MySound
        run: ./build.sh

      - name: Resolve Release Tag & Notes
        id: release_info
        env:
          INPUT_TAG: ${{ inputs.version_tag || github.event.inputs.version_tag }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ -n "$REF_NAME" ] && [[ "$REF" == refs/tags/* ]]; then
            TAG="$REF_NAME"
          else
            VER=$(grep '"version"' version.json | head -1 | sed 's/.*: *"\(.*\)".*/\1/')
            TAG="v${VER}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "MySound ${{ steps.release_info.outputs.tag }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/MySound.dmg
            build/MySound.zip
